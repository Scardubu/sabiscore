# SabiScore Experiment Registry
#
# Directive: PRODUCTION_EXECUTIVE_DIRECTIVE.md §38 (registry schema),
#            §39 (state machine), §51 (decision framework).
#
# §47 Action 9: "No research result exists unless it is reproducible from the
# registry." This file is the machine-readable index of every registered
# experiment. It does not replace the narrative studies in reports/research/
# or the incident record in docs/DEBT.md -- it makes them queryable and
# enforces that each one declares the same fields.
#
# ---------------------------------------------------------------------------
# HONESTY CONTRACT
# ---------------------------------------------------------------------------
# §38 names 37 fields. Several of them (seed, peak_rss, runtime, compute) were
# never recorded by the studies that ran before this registry existed. Those
# fields carry the literal string UNDECLARED -- the same convention
# backend/models/feature_contract.json already uses for facts no code can
# answer.
#
#   UNDECLARED  = the study did not record this. NOT "zero", NOT "none".
#   null        = genuinely not applicable to this experiment's design.
#
# Back-filling an UNDECLARED with a plausible reconstruction is fabrication
# and is prohibited. A future run of the same experiment should record the
# field properly rather than retro-fitting it here.
#
# Registry entries are migrated from studies that completed BEFORE this schema
# existed; `migrated_retrospectively: true` marks those, because they were not
# pre-registered and their field coverage is therefore partial by construction.
# ---------------------------------------------------------------------------

registry_version: "1.0.0"
directive_version: "v5"
created: "2026-09-10"
schema_reference: "PRODUCTION_EXECUTIVE_DIRECTIVE.md §38"

# §39 state machine, in order. An experiment's `state` must be one of these.
states:
  - PROPOSED
  - SOURCE_QUALIFIED
  - DATA_VALIDATED
  - TEMPORAL_VALIDATED
  - INFORMATION_TEST
  - MODEL_CANDIDATE
  - OUT_OF_SAMPLE_EVALUATION
  - STATISTICAL_REVIEW
  - ROBUSTNESS_REVIEW
  - PRODUCTION_REVIEW
  - SHADOW
  - CERTIFICATION
  - PROMOTION
  - CLOSED  # terminal: reached a §51 decision and stopped

# §51 decisions.
decisions: [PROMOTE, RESEARCH, HOLD, REJECT]

# §12 legal/access classes.
license_classes: [L0, L1, L2, L3, L4]

experiments:

  # =========================================================================
  - experiment_id: E0
    title: "Calibration repair"
    portfolio: "A"
    hypothesis: >-
      Current serving probabilities are materially miscalibrated, and a
      post-hoc recalibrator can improve reliability without degrading
      discrimination or proper scoring.
    migrated_retrospectively: true
    state: CLOSED
    decision: PROMOTE
    decision_detail: >-
      Per-candidate, not portfolio-wide. Temperature scaling ships in 5 of 6
      leagues (BUNDESLIGA, EPL, LA_LIGA, SERIE_A, pooled EREDIVISIE); vector
      scaling ships in LIGUE_1 on a genuine calibration-set + held-out win;
      beta calibration REJECT (never wins the cascade in any league); isotonic
      regression REJECT (won 4 of 4 in-sample comparisons, lost all 4 once
      scored held-out -- the defect item 64 fixed).
    information_source: "none - no new external source"
    source_version: null
    source_license_class: null
    source_coverage: null
    historical_window: UNDECLARED
    prediction_cutoff: null
    dataset_version: "backend/models/calibration_baselines.json"
    feature_version: "phase7_68"
    representation_version: "post-hoc probability recalibration"
    model_version: "v5_phase7"
    parameters: "single-elimination cascade, simplest candidate first"
    seed: UNDECLARED
    training_window: "calibration split"
    validation_windows: "independent held-out calibration holdout"
    final_holdout: "held-out persistence check (item 64's correction)"
    baseline_models: ["uncalibrated serving probabilities"]
    market_baseline: "not applicable - calibration is not a market-edge claim (§5)"
    primary_metrics: [ECE, log_loss, RPS, Brier]
    secondary_metrics: [reliability, resolution]
    bootstrap_method: UNDECLARED
    statistical_test: "held-out persistence (calibration-set win must persist)"
    multiple_testing_family: "6 leagues x 4 candidates"
    effect_size: UNDECLARED
    confidence_interval: UNDECLARED
    sample_size: UNDECLARED
    result: >-
      2 of 4 §20 B2 candidates ship somewhere; isotonic and beta rejected.
      Calibration explicitly does NOT constitute a market-edge claim.
    robustness: "held-out persistence required, which is what killed isotonic"
    failure_modes:
      - "isotonic overfits its own fit data; in-sample scoring hid it"
    compute: UNDECLARED
    peak_rss: UNDECLARED
    runtime: UNDECLARED
    artifact_location: "backend/models/calibration_baselines.json"
    provenance: ["docs/DEBT.md#70", "docs/DEBT.md#64"]
