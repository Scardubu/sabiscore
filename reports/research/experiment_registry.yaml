      - "reports/research/portfolio-b-player-availability-source-qualification.md"
    reviewer: UNDECLARED
    certification_status: "no feature schema, artifact, or gate changed"
    reopening_conditions: >-
      §42: more seasons (only 3 exist, allowing one temporal split), or a
      pre-registered cross-league pooled test justified against the Stage 2
      heterogeneity.

