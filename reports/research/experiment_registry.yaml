  - experiment_id: F2
    title: "Weather: venue-location qualification (Gate G1)"
    portfolio: "F"
    hypothesis: >-
      Venue location can be derived reliably enough from the corpus to support
      weather features.
    migrated_retrospectively: true
    state: DATA_VALIDATED
    decision: HOLD
    decision_detail: >-
      Automated derivation resolves 68.9% of the corpus. The remainder needs a
      human-reviewed place-name assertion the study must not invent (clubs
