      Superseded 2026-09-11. The previous HOLD was reached on a BORROWED
      measurement: 23.58% coverage of the Understat corpus, produced for a
      different feature decision, with this entry recording that "no new audit
      was run". That is the wrong denominator for E4. A dedicated audit against
      the corpus SabiScore actually trains and serves on (data/cache/fd_*.csv,
      12,765 fixtures, 2019/2020-2025/2026) measures G1 at 1.15%, not 23.58%,
      and measures Gate G5 (prediction-time availability) for the first time at
      0.00% - 0 of 2,058 servable 2025/2026 fixtures. REJECT rather than HOLD
      because G5 = 0 is structural, not small-sample: StatsBomb Open publishes
      no season at or after 2023/2024 for any SabiScore league, so no model,
      representation or sample size can move it. Gates C and D are both blocked
      on this one fact. Source remains RESEARCH-ONLY: D2 event completeness
      PASSES (0 malformed events, 3,917 events/match, Pressure and Carry present
      in 12/12 sampled matches) - the kill is availability, not quality.
      Phases SPADL / xT / VAEP were NOT built; §23 D5, §47 Action 6, §15 G6 and
      §44 each independently block that escalation on this evidence.
