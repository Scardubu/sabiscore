  - experiment_id: E1
    title: "Player availability delta (roster injury/suspension)"
    portfolio: "B"
    hypothesis: >-
      Pre-match player availability contains incremental information not
      already represented by SabiScore team-state features and de-vigged
      market probabilities.
    migrated_retrospectively: true
    state: CLOSED
    decision: HOLD
    decision_detail: >-
      Not PROMOTE - the paired block-bootstrap CI includes zero, pooled and in
      every league. Not REJECT - the point estimate is negative (favouring the
      candidate) in all 5 leagues in the theoretically correct direction,
      which is the pattern of a real but underpowered effect, not an inert
      one. §51's stated default for an inconclusive sample applies.
    information_source: "api_football GET /injuries (fixture- and season-scoped)"
    source_version: "api-sports.io v3, free plan"
    source_license_class: L0
    source_coverage: >-
      92.1% of records fully crosswalk to a dated corpus fixture (41,188
      records, 15 league-seasons); 98.16% fixture-level coverage (5,232 of
      5,330 fixtures carry signal on at least one side)
    historical_window: "seasons 2022, 2023, 2024; 5 leagues (EREDIVISIE/UCL excluded)"
    prediction_cutoff: "pre-kickoff; roster availability is known days ahead"
    dataset_version: "reports/research/portfolio-b-stage3-dataset.json"
    feature_version: "availability_diff (not in any served feature contract)"
    representation_version: >-
      home_unavailable_count - away_unavailable_count, distinct player_id
      deduplicated within each (team, date)
    model_version: "multinomial logistic regression on de-vigged 1X2 + candidate"
    parameters: "multinomial logistic; de-vigged Bet365 1X2 as baseline features"
    seed: UNDECLARED
    training_window: "seasons 2022+2023 (n=3,578)"
    validation_windows: "single walk-forward split (only 3 seasons available)"
    final_holdout: "season 2024 (n=1,752)"
    baseline_models: ["de-vigged market logistic baseline", "raw de-vigged market"]
    market_baseline: "raw de-vigged Bet365 probabilities, rps=0.19463"
    primary_metrics: [RPS]
    secondary_metrics: [pearson_r_vs_outcome]
    bootstrap_method: "non-overlapping block bootstrap, block size 10, 1000 replicates"
    statistical_test: "paired per-fixture RPS difference"
    multiple_testing_family: "5 leagues + pooled"
    effect_size: "pooled candidate - baseline = -0.0004 RPS"
    confidence_interval: "95% [-0.0010, +0.0001] (includes zero)"
    sample_size: 1752
    result: >-
      Stage 2 dependence real (pooled r=-0.0788, CI [-0.1057,-0.0518]) but
      heterogeneous - significant in SERIE_A/LIGUE_1/BUNDESLIGA, not EPL,
      absent in LA_LIGA. Stage 3 candidate beats both baseline and raw market
      on point estimate in all 5 leagues and pooled, but no CI excludes zero.
    robustness: >-
      Direction consistent across all 5 leagues; magnitude is not. Per-league
      Stage 2 heterogeneity was reported rather than smoothed by pooling.
    failure_modes:
      - "free plan blocks current-season injuries entirely (live serving HOLD)"
      - "sportmonks /sidelined returns HTTP 404 under the subscribed shape"
      - "_normalize_injury discards the date field, so no duration weighting"
      - "13 team names unresolved by the inherited alias tables (7.8% residual)"
    compute: UNDECLARED
    peak_rss: UNDECLARED
    runtime: UNDECLARED
    artifact_location: "reports/research/portfolio-b-stage3-incremental-value-report.json"
    provenance:
