  # =========================================================================
  - experiment_id: E1
    title: "Player availability delta (roster injury/suspension)"
    portfolio: "B"
    hypothesis: >-
      Pre-match player availability contains incremental information not
      already represented by SabiScore team-state features and de-vigged
      market probabilities.
    migrated_retrospectively: true
    state: CLOSED
    decision: HOLD
    decision_detail: >-
      Not PROMOTE - the paired block-bootstrap CI includes zero, pooled and in
      every league. Not REJECT - the point estimate is negative (favouring the
      candidate) in all 5 leagues in the theoretically correct direction,
      which is the pattern of a real but underpowered effect, not an inert
      one. §51's stated default for an inconclusive sample applies.
    information_source: "api_football GET /injuries (fixture- and season-scoped)"
    source_version: "api-sports.io v3, free plan"
    source_license_class: L0
    source_coverage: >-
      92.1% of records fully crosswalk to a dated corpus fixture (41,188
      records, 15 league-seasons); 98.16% fixture-level coverage (5,232 of
      5,330 fixtures carry signal on at least one side)
    historical_window: "seasons 2022, 2023, 2024; 5 leagues (EREDIVISIE/UCL excluded)"
    prediction_cutoff: "pre-kickoff; roster availability is known days ahead"
    dataset_version: "reports/research/portfolio-b-stage3-dataset.json"
    feature_version: "availability_diff (not in any served feature contract)"
    representation_version: >-
      home_unavailable_count - away_unavailable_count, distinct player_id
      deduplicated within each (team, date)
    model_version: "multinomial logistic regression on de-vigged 1X2 + candidate"
    parameters: "multinomial logistic; de-vigged Bet365 1X2 as baseline features"
    seed: UNDECLARED
    training_window: "seasons 2022+2023 (n=3,578)"
    validation_windows: "single walk-forward split (only 3 seasons available)"
    final_holdout: "season 2024 (n=1,752)"
    baseline_models: ["de-vigged market logistic baseline", "raw de-vigged market"]
    market_baseline: "raw de-vigged Bet365 probabilities, rps=0.19463"
    primary_metrics: [RPS]
    secondary_metrics: [pearson_r_vs_outcome]
    bootstrap_method: "non-overlapping block bootstrap, block size 10, 1000 replicates"
    statistical_test: "paired per-fixture RPS difference"
    multiple_testing_family: "5 leagues + pooled"
    effect_size: "pooled candidate - baseline = -0.0004 RPS"
    confidence_interval: "95% [-0.0010, +0.0001] (includes zero)"
    sample_size: 1752
    result: >-
      Stage 2 dependence real (pooled r=-0.0788, CI [-0.1057,-0.0518]) but
      heterogeneous - significant in SERIE_A/LIGUE_1/BUNDESLIGA, not EPL,
      absent in LA_LIGA. Stage 3 candidate beats both baseline and raw market
      on point estimate in all 5 leagues and pooled, but no CI excludes zero.
    robustness: >-
      Direction consistent across all 5 leagues; magnitude is not. Per-league
      Stage 2 heterogeneity was reported rather than smoothed by pooling.
    failure_modes:
      - "free plan blocks current-season injuries entirely (live serving HOLD)"
      - "sportmonks /sidelined returns HTTP 404 under the subscribed shape"
      - "_normalize_injury discards the date field, so no duration weighting"
      - "13 team names unresolved by the inherited alias tables (7.8% residual)"
    compute: UNDECLARED
    peak_rss: UNDECLARED
    runtime: UNDECLARED
    artifact_location: "reports/research/portfolio-b-stage3-incremental-value-report.json"
    provenance:
      - "docs/DEBT.md#65"
      - "reports/research/portfolio-b-player-availability-source-qualification.md"
    reviewer: UNDECLARED
    certification_status: "no feature schema, artifact, or gate changed"
    reopening_conditions: >-
      §42: more seasons (only 3 exist, allowing one temporal split), or a
      pre-registered cross-league pooled test justified against the Stage 2
      heterogeneity.

  # =========================================================================
  - experiment_id: E2
    title: "Expected XI / lineup continuity"
    portfolio: "B"
    hypothesis: >-
      Lineup continuity and expected-XI state contribute incremental signal
      beyond roster availability alone.
    migrated_retrospectively: true
    state: SOURCE_QUALIFIED
    decision: HOLD
    decision_detail: >-
      HOLD on two independent gates, one structural and one operational.
      (1) SERVING, unchanged from Portfolio B: confirmed lineups publish 20-40
      minutes before kickoff, failing Gate G5 for this platform's
      browse-days-ahead surface. (2) ACQUISITION, newly measured 2026-09-10:
      the historical data DOES exist and IS accessible on the current plan
      (probe returned VERIFIED, 40 records for a season-2024 fixture), and the
      record content is sufficient - player_id, role="starting", and formation
      are exactly what expected-XI overlap, starter-absence counts and
      positional disruption need. But /fixtures/lineups takes only a `fixture`
      parameter with no league-season bulk form, so one season x 5 leagues
      costs 1,752 requests = 17.5 days of uninterrupted free-tier quota, and
      continuity metrics need the whole season rather than a sample. This is a
      costed operational gate, not a kill (§41) - the same class as E1's
      plan-tier wall, and resolvable by the same paid tier.
    information_source: "api_football /fixtures/lineups (collected today, unconsumed)"
    source_version: "api-sports.io v3, free plan (100 req/day)"
    source_license_class: L0
    source_coverage: >-
      Content sufficiency CONFIRMED on a live probe: 40 records for one
      fixture, carrying player_id, player_name, role, formation, team_id.
      Fixture-level coverage across a season NOT measured - measuring it is
      itself the 1,752-request acquisition this entry is blocked on.
    historical_window: >-
      Season 2024 confirmed reachable (the plan blocks only the current
      season, per E1's finding). Earlier seasons untested.
    prediction_cutoff: "T-20 to T-40 minutes - incompatible with days-ahead serving"
    dataset_version: null
    feature_version: null
    representation_version: "not built"
    model_version: null
    parameters: null
    seed: null
    training_window: null
    validation_windows: null
    final_holdout: null
    baseline_models: []
    market_baseline: null
    primary_metrics: [RPS]
    secondary_metrics: []
    bootstrap_method: null
    statistical_test: null
    multiple_testing_family: null
    effect_size: null
    confidence_interval: null
    sample_size: null
    result: >-
      No information-value test was run, and none can be until the corpus is
      acquired. What IS now established: the endpoint answers for historical
      fixtures on this plan, and its payload carries every field the §22
      representations require. orchestrator._collect_lineup_refresh() already
      exists as a dedicated late-firing evidence profile, so the architecture
      anticipated the timing problem, but nothing downstream consumes it.
    robustness: null
    failure_modes:
      - "Gate G5 structural failure for the primary serving surface (20-40 min pre-kickoff)"
      - "no bulk query shape: 1 request per fixture, 1,752 per season x 5 leagues"
      - "continuity metrics need consecutive fixtures per team, so sampling does not reduce the cost"
    compute: null
    peak_rss: null
    runtime: "1 live request spent on the feasibility probe"
    artifact_location: "reports/research/e2-lineup-availability-probe.json"
    provenance:
      - "docs/DEBT.md#65"
      - "reports/research/portfolio-b-player-availability-source-qualification.md §2b"
      - "reports/research/e2-lineup-availability-probe.json"
      - "backend/scripts/probe_lineup_availability.py"
    reviewer: UNDECLARED
    certification_status: "not a candidate"
    reopening_conditions: >-
      §42: (a) a paid api_football tier, which converts the 17.5-day quota wall
      into a bounded backfill and unblocks a retrospective Stage 1-3 test; or
      (b) a separately prioritised near-kickoff product surface, which would
      make the prediction cutoff compatible for serving. These are independent
      - (a) alone enables research, (b) alone enables serving, and promotion
      needs both. Do not build a training feature before (a).

